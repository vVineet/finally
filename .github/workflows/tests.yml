name: Tests

# Runs pytest + ruff (backend) and unit tests (frontend) on every PR.
# Added per PLAN.md §13.E -- previously the only workflows in this repo were
# the two Claude Code review workflows below, and nothing actually ran tests.
# Does not touch claude.yml / claude-code-review.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies (incl. dev extras)
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --if-present: at the time this workflow was added, frontend/package.json
      # has no "test" script yet (frontend build in progress in parallel).
      # These steps pass trivially until it's added, then start running for
      # free -- no further edits to this file needed. See DEVOPS_SUMMARY.md.
      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present
