# FinAlly — optional convenience wrapper (PLAN.md §11 marks this optional;
# scripts/start.sh|start.ps1 use plain `docker build`/`docker run` and do not
# depend on this file). Equivalent to:
#
#   docker build -t finally .
#   docker run -d --name finally -p 8000:8000 \
#       -v finally-data:/app/db --env-file .env finally
#
# Reset (wipes the database, keeps images): docker compose down && docker volume rm finally-data

services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - finally-data:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  finally-data:
    name: finally-data
